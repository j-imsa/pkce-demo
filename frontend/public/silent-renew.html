<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Silent Renew</title>
</head>
<body>
<script src="https://unpkg.com/oidc-client-ts@3.3.0/dist/browser/oidc-client-ts.min.js"></script>
<script type="module">
    if (globalThis.oidc) {
        const mgr = new globalThis.oidc.UserManager({
            authority: "http://localhost:8080/realms/pkce-demo",
            client_id: "my-react-app",
            userStore: new globalThis.oidc.WebStorageStateStore({store: new globalThis.oidc.InMemoryWebStorage()})
        });

        try {
            await mgr.signinSilentCallback();
        } catch (error) {
            console.error('Silent renew error:', error);
        }
    } else {
        console.error('oidc-client-ts script not loaded');
    }
</script>
</body>
</html>
